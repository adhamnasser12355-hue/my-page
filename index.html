<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adham Nasser Ibrahim | SOC Analyst</title>
<style>
:root{
  --g1:#14238F; --g2:#3455F0; --card:#FFFFFF; --ink:#0C1B3D; --accent:#2446D8; --on:#FFFFFF; --soft:#D6DEFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--g1:#070D24; --g2:#15245E; --card:#111C38; --ink:#E8EDFA; --accent:#8FA8FF; --soft:#A9B7E6; color-scheme:dark}
}
:root[data-theme="dark"]{--g1:#070D24; --g2:#15245E; --card:#111C38; --ink:#E8EDFA; --accent:#8FA8FF; --soft:#A9B7E6; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:linear-gradient(160deg,var(--g1),var(--g2)) fixed;
  color:var(--on);
  font:500 17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;
}
main{width:100%;max-width:420px;padding:56px 24px 48px;text-align:center}
.photo{
  width:148px;height:148px;border-radius:50%;margin:0 auto 22px;
  border:5px solid #fff;background:var(--card);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font:700 48px/1 system-ui,sans-serif;color:var(--accent);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;color:#fff}
.role{margin:6px 0 36px;font-size:18px;color:var(--soft);font-weight:500}
.links{display:flex;flex-direction:column;gap:14px}
.links a{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--card);color:var(--accent);text-decoration:none;
  padding:16px 20px;border-radius:16px;font-weight:700;font-size:18px;
  transition:transform .15s ease;
}
.links a:hover{transform:translateY(-2px)}
.links a:active{transform:scale(.98)}
.links a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.links svg{width:22px;height:22px;flex:none}
@media (prefers-reduced-motion:reduce){.links a{transition:none}}
</style>
</head>
